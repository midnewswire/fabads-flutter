name: fab_ads_inmobi
description: InMobi for fab_ads. Android only; it runs the fabads-kotlin inmobi module.
version: 1.0.0
publish_to: none
repository: https://github.com/midnewswire/fabads-flutter

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  fab_ads:
    path: ../fab_ads

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fabads.flutter.inmobi
        pluginClass: FabInMobiPlugin
