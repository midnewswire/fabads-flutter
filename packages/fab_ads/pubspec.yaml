name: fab_ads
description: One ads API for the fab Flutter apps. Add one fab_ads_<network> package per ad network you use.
version: 1.0.0
publish_to: none
repository: https://github.com/midnewswire/fabads-flutter

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fabads.flutter
        pluginClass: FabAdsPlugin
